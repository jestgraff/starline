services:
  bot:
    build: .
    container_name: starline_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: postgres:17
    container_name: starline_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
volumes:
  postgres_data: